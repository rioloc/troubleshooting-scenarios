logging:
  source_level: DEBUG

core:
  max_threads: 3
  fail_on_invalid_data: true
  skip_on_failure: false

llm:
  provider: openai
  model: gpt-5.4-mini
  max_tokens: 1000
  cache_enabled: false

agents:
  enabled: true
  default:
    agent: [agent_openai, agent_gemini, agent_opus]
    repeat: 3
    agent_config:
      timeout: 600
  agent_openai:
    type: openshift_agentic_run
    namespace: openshift-lightspeed
    auto_approve: true
    cleanup_openshift_agentic_runs: false
    timeout: 600
    poll_interval: 5
    agent_ref: default
  agent_gemini:
    type: openshift_agentic_run
    namespace: openshift-lightspeed
    auto_approve: true
    cleanup_openshift_agentic_runs: false
    timeout: 600
    poll_interval: 5
    agent_ref: gemini
  agent_opus:
    type: openshift_agentic_run
    namespace: openshift-lightspeed
    auto_approve: true
    cleanup_openshift_agentic_runs: false
    timeout: 600
    poll_interval: 5
    agent_ref: opus

storage:
  - type: file
    output_dir: ./eval_output
    enabled_outputs: [csv, json]

environment:
  LITELLM_LOG: ERROR
