    response: '## Request


      The service svc-selector-svc in namespace svc-selector-test

      serves no traffic even though its backing application is

      running and healthy. Analyze the root cause and suggest a fix.



      ## Analysis


      2 option(s) proposed


      ### Option 0 (Approved): Option 1 — Patch the Service selector to match the
      pod labels

      **Diagnosis:** Correct the Service selector to `app=svc-selector-demo` so it
      matches the existing pod labels. This is the least disruptive fix — it changes
      only the Service object and requires no pod restart. (Confidence: )

      **Root Cause:** Service selector `app=svc-selector-app` does not match pod label
      `app=svc-selector-demo`.

      **Proposed Actions:**

      1. [mutation] Update the Service selector to match the pod label app=svc-selector-demo

      2. [verification] Verify the Endpoints object now lists the pod IP (10.129.2.23)

      **Risk:**  | **Reversible:** Reversible


      ### Option 1 : Option 2 — Patch the Deployment pod template labels to match
      the Service selector

      **Diagnosis:** Change the Deployment''s pod template labels to `app=svc-selector-app`
      to match the existing Service selector. This triggers a rolling restart of the
      pods. (Confidence: )

      **Root Cause:** Service selector `app=svc-selector-app` does not match pod label
      `app=svc-selector-demo`.

      **Proposed Actions:**

      1. [mutation] Update the Deployment''s pod template label and selector to app=svc-selector-app

      2. [wait] Wait for the new pods to roll out successfully

      3. [verification] Verify the Endpoints object now lists the new pod IP

      **Risk:**  | **Reversible:** Partial


      ## Outcome


      Sandbox completed; Execution step not configured; Verification step not configured
      in workflow'
