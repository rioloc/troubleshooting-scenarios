        diagnosis:
          rootCause: The Service `svc-selector-svc` uses the selector `app=svc-selector-app`,
            but the backing pod (from Deployment `svc-selector-demo`) carries the
            label `app=svc-selector-demo`. Since these labels do not match, the Service
            discovers zero endpoints and routes no traffic to the healthy pod.
          summary: 'Service selector mismatch: the Service selects `app=svc-selector-app`
            while the pods are labeled `app=svc-selector-demo`. The Endpoints object
            and EndpointSlice both show no addresses. The pod itself is 1/1 Running
            and healthy — this is purely a label/selector configuration error.'
        options:
        - diagnosis:
            rootCause: Service selector `app=svc-selector-app` does not match pod
              label `app=svc-selector-demo`.
            summary: Correct the Service selector to `app=svc-selector-demo` so it
              matches the existing pod labels. This is the least disruptive fix —
              it changes only the Service object and requires no pod restart.
          rbac:
            namespaceScoped:
            - apiGroups:
              - ''
              justification: Required to patch the Service selector in the svc-selector-test
                namespace
              namespace: svc-selector-test
              resources:
              - services
              verbs:
              - patch
          remediationPlan:
            actions:
            - command: oc patch svc svc-selector-svc -n svc-selector-test -p '{"spec":{"selector":{"app":"svc-selector-demo"}}}'
              description: Update the Service selector to match the pod label app=svc-selector-demo
              type: mutation
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              description: Verify the Endpoints object now lists the pod IP (10.129.2.23)
              type: verification
            description: Patch the Service selector from `app=svc-selector-app` to
              `app=svc-selector-demo` so it matches the Deployment's pod template
              labels.
            reversible: Reversible
            rollbackPlan:
              command: oc patch svc svc-selector-svc -n svc-selector-test -p '{"spec":{"selector":{"app":"svc-selector-app"}}}'
              description: Revert the Service selector back to the original value
                app=svc-selector-app
          title: Option 1 — Patch the Service selector to match the pod labels
          verification:
            description: Confirm the Service now has endpoints and can route traffic
              to the backing pod.
            steps:
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show 10.129.2.23:8080
              name: Check endpoints are populated
              type: command
            - command: oc run curl-test --rm -i --restart=Never --image=curlimages/curl
                -n svc-selector-test -- curl -s -o /dev/null -w '%{http_code}' http://svc-selector-svc:8080
              expected: HTTP 200 response
              name: Test connectivity through the Service
              type: command
        - diagnosis:
            rootCause: Service selector `app=svc-selector-app` does not match pod
              label `app=svc-selector-demo`.
            summary: Change the Deployment's pod template labels to `app=svc-selector-app`
              to match the existing Service selector. This triggers a rolling restart
              of the pods.
          rbac:
            namespaceScoped:
            - apiGroups:
              - apps
              justification: Required to patch the Deployment's pod template labels
                in the svc-selector-test namespace
              namespace: svc-selector-test
              resources:
              - deployments
              verbs:
              - patch
          remediationPlan:
            actions:
            - command: oc patch deployment svc-selector-demo -n svc-selector-test
                --type='json' -p '[{"op":"replace","path":"/spec/selector/matchLabels/app","value":"svc-selector-app"},{"op":"replace","path":"/spec/template/metadata/labels/app","value":"svc-selector-app"}]'
              description: Update the Deployment's pod template label and selector
                to app=svc-selector-app
              type: mutation
            - command: oc rollout status deployment/svc-selector-demo -n svc-selector-test
                --timeout=120s
              description: Wait for the new pods to roll out successfully
              type: wait
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              description: Verify the Endpoints object now lists the new pod IP
              type: verification
            description: Patch the Deployment's pod template labels and matchLabels
              to use `app=svc-selector-app`, aligning them with the Service selector.
              This causes a rollout of new pods.
            reversible: Partial
            rollbackPlan:
              command: oc patch deployment svc-selector-demo -n svc-selector-test
                --type='json' -p '[{"op":"replace","path":"/spec/selector/matchLabels/app","value":"svc-selector-demo"},{"op":"replace","path":"/spec/template/metadata/labels/app","value":"svc-selector-demo"}]'
              description: 'Revert the Deployment labels back to app=svc-selector-demo.
                Note: Deployment spec.selector is immutable after creation — this
                patch will be rejected. You would need to delete and recreate the
                Deployment.'
          title: Option 2 — Patch the Deployment pod template labels to match the
            Service selector
          verification:
            description: Confirm the new pods are running with the corrected label
              and the Service has endpoints.
            steps:
            - command: oc get pods -n svc-selector-test --show-labels
              expected: Pods should show label app=svc-selector-app
              name: Check pods have correct label
              type: command
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show the new pod's IP on port
                8080
              name: Check endpoints are populated
              type: command
            - command: oc run curl-test --rm -i --restart=Never --image=curlimages/curl
                -n svc-selector-test -- curl -s -o /dev/null -w '%{http_code}' http://svc-selector-svc:8080
              expected: HTTP 200 response
              name: Test connectivity through the Service
              type: command
    openshift_agentic_run_phases:
    - analysis
