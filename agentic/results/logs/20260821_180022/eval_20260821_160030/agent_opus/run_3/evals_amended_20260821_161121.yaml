        diagnosis:
          rootCause: The Service `svc-selector-svc` has selector `app=svc-selector-app`,
            but the backing Pod (owned by Deployment `svc-selector-demo`) carries
            the label `app=svc-selector-demo`. The selector mismatch means the Service
            matches zero Pods, resulting in empty Endpoints/EndpointSlices and no
            traffic being forwarded.
          summary: Service selector `app=svc-selector-app` does not match any Pod
            labels. The only running Pod has label `app=svc-selector-demo`. The Endpoints
            object for the Service has null subsets, confirming zero backends.
        options:
        - diagnosis:
            rootCause: Service selector `app=svc-selector-app` does not match the
              Pod label `app=svc-selector-demo`.
            summary: Update the Service selector to `app=svc-selector-demo` so it
              matches the running Pod.
          rbac:
            namespaceScoped:
            - apiGroups:
              - ''
              justification: Required to patch the Service selector to match Pod labels
              namespace: svc-selector-test
              resources:
              - services
              verbs:
              - patch
          remediationPlan:
            actions:
            - command: oc patch svc svc-selector-svc -n svc-selector-test -p '{"spec":{"selector":{"app":"svc-selector-demo"}}}'
              description: Update the Service selector from app=svc-selector-app to
                app=svc-selector-demo
              type: mutation
            - command: 'oc get endpoints svc-selector-svc -n svc-selector-test -o
                json | jq ''{subsets: .subsets}'''
              description: Verify that the Endpoints object now has populated subsets
                with Pod IPs
              type: verification
            - command: oc get endpointslices -l kubernetes.io/service-name=svc-selector-svc
                -n svc-selector-test -o json | jq '[.items[].endpoints[]?.addresses]'
              description: Verify EndpointSlice has backend addresses
              type: verification
            description: Patch the Service selector to match the existing Pod/Deployment
              label `app=svc-selector-demo`. This is the least disruptive fix — no
              Pod restart required, traffic starts flowing immediately.
            reversible: Reversible
            rollbackPlan:
              command: oc patch svc svc-selector-svc -n svc-selector-test -p '{"spec":{"selector":{"app":"svc-selector-app"}}}'
              description: Revert the Service selector back to the original value
                app=svc-selector-app
          summary: Patch the Service selector to match existing Pod labels. No Pod
            restart needed, immediate effect.
          title: 'Option 1: Patch the Service selector to match existing Pod labels'
          verification:
            description: After patching the Service, confirm that Endpoints are populated
              and traffic reaches the backend Pod.
            steps:
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show a Pod IP:port (e.g. 10.129.2.23:8080)
              name: Check Endpoints are populated
              type: command
            - command: oc run curl-test --rm -i --restart=Never --image=curlimages/curl
                -n svc-selector-test -- curl -s -o /dev/null -w '%{http_code}' http://svc-selector-svc.svc-selector-test.svc:8080
              expected: HTTP 200 response code
              name: Curl the Service ClusterIP
              type: command
        - diagnosis:
            rootCause: Service selector `app=svc-selector-app` does not match the
              Pod label `app=svc-selector-demo`.
            summary: Update the Deployment's Pod template labels to `app=svc-selector-app`
              so Pods match the Service selector.
          rbac:
            namespaceScoped:
            - apiGroups:
              - apps
              justification: Required to patch the Deployment's Pod template labels
                and selector
              namespace: svc-selector-test
              resources:
              - deployments
              verbs:
              - patch
              - update
          remediationPlan:
            actions:
            - command: oc patch deployment svc-selector-demo -n svc-selector-test
                -p '{"spec":{"template":{"metadata":{"labels":{"app":"svc-selector-app"}}}}}'
              description: Update Pod template label from app=svc-selector-demo to
                app=svc-selector-app so Pods match the Service selector
              type: mutation
            - command: oc patch deployment svc-selector-demo -n svc-selector-test
                -p '{"spec":{"selector":{"matchLabels":{"app":"svc-selector-app"}}}}'
              description: 'Update Deployment selector to match the new Pod template
                label. NOTE: Deployment selectors are immutable after creation — if
                this fails, the Deployment must be recreated. See fallback action
                below.'
              type: mutation
            - command: oc rollout status deployment/svc-selector-demo -n svc-selector-test
                --timeout=120s
              description: Wait for the rolling update to complete
              type: verification
            - command: 'oc get endpoints svc-selector-svc -n svc-selector-test -o
                json | jq ''{subsets: .subsets}'''
              description: Verify that the Endpoints object now has populated subsets
              type: verification
            description: Patch the Deployment's Pod template labels to include `app=svc-selector-app`.
              This triggers a rolling restart of the Pods. More disruptive than Option
              1 but may be preferred if the Service name is canonical.
            reversible: Partial
            rollbackPlan:
              command: oc patch deployment svc-selector-demo -n svc-selector-test
                -p '{"spec":{"template":{"metadata":{"labels":{"app":"svc-selector-demo"}}}}}'
              description: Revert the Pod template label back to app=svc-selector-demo
                (only works if selector was not changed)
          summary: Patch the Deployment labels to match the Service selector. Causes
            a Pod rolling restart. Deployment selector immutability may require Deployment
            recreation.
          title: 'Option 2: Patch the Deployment labels to match the existing Service
            selector'
          verification:
            description: After updating the Deployment, confirm new Pods carry the
              correct label and the Service has endpoints.
            steps:
            - command: oc get pods -n svc-selector-test -l app=svc-selector-app
              expected: At least one Running and Ready Pod should be listed
              name: Check Pod labels match Service selector
              type: command
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show a Pod IP:port
              name: Check Endpoints are populated
              type: command
    openshift_agentic_run_phases:
    - analysis
