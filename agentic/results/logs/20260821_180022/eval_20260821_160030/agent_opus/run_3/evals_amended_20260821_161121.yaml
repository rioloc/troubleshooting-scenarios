    response: '## Request


      The service svc-selector-svc in namespace svc-selector-test

      serves no traffic even though its backing application is

      running and healthy. Analyze the root cause and suggest a fix.



      ## Analysis


      2 option(s) proposed


      ### Option 0 (Approved): Option 1: Patch the Service selector to match existing
      Pod labels

      **Diagnosis:** Update the Service selector to `app=svc-selector-demo` so it
      matches the running Pod. (Confidence: )

      **Root Cause:** Service selector `app=svc-selector-app` does not match the Pod
      label `app=svc-selector-demo`.

      **Proposed Actions:**

      1. [mutation] Update the Service selector from app=svc-selector-app to app=svc-selector-demo

      2. [verification] Verify that the Endpoints object now has populated subsets
      with Pod IPs

      3. [verification] Verify EndpointSlice has backend addresses

      **Risk:**  | **Reversible:** Reversible


      ### Option 1 : Option 2: Patch the Deployment labels to match the existing Service
      selector

      **Diagnosis:** Update the Deployment''s Pod template labels to `app=svc-selector-app`
      so Pods match the Service selector. (Confidence: )

      **Root Cause:** Service selector `app=svc-selector-app` does not match the Pod
      label `app=svc-selector-demo`.

      **Proposed Actions:**

      1. [mutation] Update Pod template label from app=svc-selector-demo to app=svc-selector-app
      so Pods match the Service selector

      2. [mutation] Update Deployment selector to match the new Pod template label.
      NOTE: Deployment selectors are immutable after creation — if this fails, the
      Deployment must be recreated. See fallback action below.

      3. [verification] Wait for the rolling update to complete

      4. [verification] Verify that the Endpoints object now has populated subsets

      **Risk:**  | **Reversible:** Partial


      ## Outcome


      Sandbox completed; Execution step not configured; Verification step not configured
      in workflow'
