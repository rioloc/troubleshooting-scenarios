        diagnosis:
          rootCause: 'Service selector mismatch: The Service `svc-selector-svc` selects
            pods with label `app=svc-selector-app`, but the only running pod (`svc-selector-demo-66d55b6889-gkcnl`)
            has label `app=svc-selector-demo`. Because no pod matches the Service''s
            selector, the Endpoints and EndpointSlice objects are empty (`subsets:
            null`, `endpoints: null`), and the Service routes traffic to nowhere.'
          summary: Service `svc-selector-svc` in namespace `svc-selector-test` has
            zero endpoints. The Service's selector is `app=svc-selector-app` but the
            Deployment `svc-selector-demo` creates pods with label `app=svc-selector-demo`.
            The label mismatch means no pods are selected by the Service, so all traffic
            to the Service is dropped.
        options:
        - diagnosis:
            rootCause: 'Service selector mismatch: Service selects `app=svc-selector-app`
              but pods have label `app=svc-selector-demo`.'
            summary: The Service selector does not match any pod labels in the namespace.
              Endpoints are empty.
          rbac:
            namespaceScoped:
            - apiGroups:
              - ''
              justification: Required to patch the Service selector to fix the label
                mismatch.
              namespace: svc-selector-test
              resources:
              - services
              verbs:
              - patch
          remediationPlan:
            actions:
            - command: 'oc patch svc svc-selector-svc -n svc-selector-test --type=''json''
                -p=''[{"op": "replace", "path": "/spec/selector/app", "value": "svc-selector-demo"}]'''
              description: 'Update the Service selector from `app: svc-selector-app`
                to `app: svc-selector-demo`.'
              type: mutation
            - command: 'oc get endpoints svc-selector-svc -n svc-selector-test -o
                json | jq ''{name: .metadata.name, subsets: .subsets}'''
              description: Verify that the Endpoints object now contains the pod IP.
              type: verification
            - command: 'oc get endpointslice -l kubernetes.io/service-name=svc-selector-svc
                -n svc-selector-test -o json | jq ''[.items[] | {name: .metadata.name,
                endpoints: .endpoints, ports: .ports}]'''
              description: Verify that the EndpointSlice now lists the pod as a ready
                endpoint.
              type: verification
            description: 'Patch the Service selector to match the existing pod label
              `app: svc-selector-demo`.'
            reversible: Reversible
            rollbackPlan:
              command: 'oc patch svc svc-selector-svc -n svc-selector-test --type=''json''
                -p=''[{"op": "replace", "path": "/spec/selector/app", "value": "svc-selector-app"}]'''
              description: 'Revert the Service selector back to `app: svc-selector-app`.'
          summary: 'Update the Service''s selector from `app: svc-selector-app` to
            `app: svc-selector-demo` so it matches the running pods. This is the least
            disruptive option — no pod restart required, traffic begins flowing immediately.'
          title: 'Option 1: Patch the Service selector to match the existing pod label'
          verification:
            description: Confirm the Service now has endpoints and can serve traffic.
            steps:
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show the pod IP and port (e.g.,
                10.129.2.23:8080).
              name: Check Endpoints are populated
              type: command
            - command: oc run curl-test --rm -i --restart=Never --image=curlimages/curl
                -n svc-selector-test -- curl -s -o /dev/null -w '%{http_code}' http://svc-selector-svc:8080
              expected: HTTP 200 response.
              name: Curl the Service from within the cluster
              type: command
        - diagnosis:
            rootCause: 'Service selector mismatch: Service selects `app=svc-selector-app`
              but pods have label `app=svc-selector-demo`.'
            summary: The pod labels do not match the Service selector. Endpoints are
              empty.
          rbac:
            namespaceScoped:
            - apiGroups:
              - apps
              justification: Required to patch or recreate the Deployment with corrected
                pod template labels.
              namespace: svc-selector-test
              resources:
              - deployments
              verbs:
              - patch
              - delete
              - create
          remediationPlan:
            actions:
            - command: 'oc patch deployment svc-selector-demo -n svc-selector-test
                --type=''json'' -p=''[{"op": "replace", "path": "/spec/template/metadata/labels/app",
                "value": "svc-selector-app"}, {"op": "replace", "path": "/spec/selector/matchLabels/app",
                "value": "svc-selector-app"}]'''
              description: 'Update the Deployment''s pod template label and selector
                from `app: svc-selector-demo` to `app: svc-selector-app`. Note: changing
                the Deployment selector on an existing Deployment is an immutable
                field change. If this fails, the Deployment must be deleted and recreated.'
              type: mutation
            - command: "oc delete deployment svc-selector-demo -n svc-selector-test\
                \ && oc create -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\n\
                metadata:\n  name: svc-selector-demo\n  namespace: svc-selector-test\n\
                spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: svc-selector-app\n\
                \  template:\n    metadata:\n      labels:\n        app: svc-selector-app\n\
                \    spec:\n      containers:\n      - name: nginx\n        image:\
                \ docker.io/nginxinc/nginx-unprivileged:1.27\n        ports:\n   \
                \     - containerPort: 8080\nEOF"
              description: 'Fallback: If the patch fails because spec.selector is
                immutable, delete and recreate the Deployment with the corrected label.'
              type: mutation
            - command: oc rollout status deployment/svc-selector-demo -n svc-selector-test
                --timeout=120s
              description: Wait for the Deployment rollout to complete.
              type: verification
            - command: 'oc get endpoints svc-selector-svc -n svc-selector-test -o
                json | jq ''{name: .metadata.name, subsets: .subsets}'''
              description: Verify that the Endpoints object now contains the new pod
                IP.
              type: verification
            description: 'Patch the Deployment''s pod template to set the label `app:
              svc-selector-app`, matching the Service selector. This triggers a rolling
              update.'
            reversible: Partial
            rollbackPlan:
              command: "oc delete deployment svc-selector-demo -n svc-selector-test\
                \ && oc create -f - <<'EOF'\napiVersion: apps/v1\nkind: Deployment\n\
                metadata:\n  name: svc-selector-demo\n  namespace: svc-selector-test\n\
                spec:\n  replicas: 1\n  selector:\n    matchLabels:\n      app: svc-selector-demo\n\
                \  template:\n    metadata:\n      labels:\n        app: svc-selector-demo\n\
                \    spec:\n      containers:\n      - name: nginx\n        image:\
                \ docker.io/nginxinc/nginx-unprivileged:1.27\n        ports:\n   \
                \     - containerPort: 8080\nEOF"
              description: 'Delete and recreate the Deployment with the original label
                `app: svc-selector-demo`. Note: this causes brief downtime during
                recreation.'
          summary: 'Update the Deployment''s pod template labels to include `app:
            svc-selector-app` (matching the Service selector). This triggers a rolling
            restart of pods. Choose this if the Service selector value `svc-selector-app`
            is the canonical/intended name and the Deployment label is wrong.'
          title: 'Option 2: Patch the Deployment to add the label the Service expects'
          verification:
            description: Confirm the pods now carry the correct label and the Service
              has endpoints.
            steps:
            - command: oc get pods -n svc-selector-test --show-labels
              expected: Pods should have label `app=svc-selector-app`.
              name: Check pod labels
              type: command
            - command: oc get endpoints svc-selector-svc -n svc-selector-test
              expected: The ENDPOINTS column should show the pod IP and port.
              name: Check Endpoints are populated
              type: command
    openshift_agentic_run_phases:
    - analysis
